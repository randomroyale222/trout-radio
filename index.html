<h1>Trout Radio</h1>
<p>Trout Radio is a personal music player used by one streamer on their own computer. It plays the streamer's own YouTube playlist during streams and lets the streamer take songs out of that playlist.</p>
<p>It is not a public service: nobody else can sign in to it or use it.</p>
